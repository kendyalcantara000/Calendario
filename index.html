<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Mi Calendario</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
:root {
  --bg: #f4f6f8;
  --card: #ffffff;
  --text: #000000;
}

.dark {
  --bg: #121212;
  --card: #1e1e1e;
  --text: #ffffff;
}

body {
  background: var(--bg);
  color: var(--text);
  font-family: Arial, sans-serif;
  margin: 0;
  padding: 15px;
}

h1 {
  text-align: center;
}

button {
  padding: 8px 12px;
  border: none;
  border-radius: 6px;
  cursor: pointer;
}

.top-bar {
  display: flex;
  justify-content: space-between;
  margin-bottom: 15px;
}

.day {
  background: var(--card);
  padding: 15px;
  border-radius: 10px;
  margin-bottom: 15px;
}

.task {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin: 6px 0;
}

.task span {
  flex: 1;
  margin-left: 8px;
}

.done span {
  text-decoration: line-through;
  opacity: 0.6;
}

.delete {
  background: red;
  color: white;
  margin-left: 8px;
}
</style>
</head>

<body>

<div class="top-bar">
  <button onclick="toggleDark()">🌙 / ☀️</button>
  <button onclick="addTask()">➕ Agregar</button>
</div>

<h1>📅 Mi Calendario</h1>

<div id="calendar"></div>

<script>
const days = ["Lunes","Martes","Miércoles","Jueves","Viernes"];
let data = JSON.parse(localStorage.getItem("calendar")) || {};

function save() {
  localStorage.setItem("calendar", JSON.stringify(data));
}

function toggleDark() {
  document.body.classList.toggle("dark");
  localStorage.setItem("dark", document.body.classList.contains("dark"));
}

if (localStorage.getItem("dark") === "true") {
  document.body.classList.add("dark");
}

function render() {
  const cal = document.getElementById("calendar");
  cal.innerHTML = "";

  days.forEach(day => {
    if (!data[day]) data[day] = [];

    const box = document.createElement("div");
    box.className = "day";
    box.innerHTML = `<h2>${day}</h2>`;

    data[day].forEach((t, i) => {
      const row = document.createElement("div");
      row.className = "task" + (t.done ? " done" : "");

      row.innerHTML = `
        <input type="checkbox" ${t.done ? "checked" : ""} onchange="toggleDone('${day}',${i})">
        <span>${t.time} – ${t.text}</span>
        <button class="delete" onclick="removeTask('${day}',${i})">✕</button>
      `;

      box.appendChild(row);
    });

    cal.appendChild(box);
  });

  save();
}

function toggleDone(day, i) {
  data[day][i].done = !data[day][i].done;
  render();
}

function removeTask(day, i) {
  data[day].splice(i,1);
  render();
}

function addTask() {
  const day = prompt("Día (Lunes, Martes, etc):");
  const time = prompt("Hora (ej: 2:00 - 3:00):");
  const text = prompt("Actividad:");

  if (!day || !time || !text) return;

  if (!data[day]) data[day] = [];
  data[day].push({time, text, done:false});
  render();
}

render();
</script>

</body>
</html>
