<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Mi Calendario</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  font-family: Arial, sans-serif;
  background: #f4f6f8;
  margin: 0;
  padding: 15px;
}

h1 {
  text-align: center;
}

.day {
  background: #ffffff;
  border-radius: 12px;
  padding: 15px;
  margin-bottom: 15px;
}

.task {
  display: flex;
  align-items: center;
  margin: 6px 0;
}

.task span {
  flex: 1;
  margin-left: 8px;
}

.done span {
  text-decoration: line-through;
  opacity: 0.6;
}

.add-btn {
  margin-top: 10px;
  width: 100%;
  padding: 6px;
}
</style>
</head>

<body>

<h1>📅 Mi Calendario</h1>
<div id="calendar"></div>

<script>
const base = {
  "Lunes": [
    "9:00 - 12:00 🏋️ Gimnasio",
    "1:00 - 2:00 🗣️ Inglés",
    "2:00 - 4:30 🎓 UNICARIBE",
    "6:00 - 8:00 📘 Español I",
    "8:00 - 10:00 📐 Razonamiento Lógico",
    "11:00 😴 Dormir"
  ],
  "Martes": [
    "9:00 - 12:00 🏋️ Gimnasio",
    "1:00 - 2:00 🗣️ Inglés",
    "2:00 - 4:30 🎓 UNICARIBE",
    "6:00 - 8:00 🧪 Lab CAM-112",
    "8:00 - 10:00 📊 Precálculo",
    "11:00 😴 Dormir"
  ],
  "Miércoles": [
    "9:00 - 12:00 🏋️ Gimnasio",
    "1:00 - 2:00 🗣️ Inglés",
    "2:00 - 4:30 🎓 UNICARIBE",
    "5:00 - 6:00 🧭 Orientación Profesional",
    "6:00 - 8:00 📘 Español I",
    "8:00 - 10:00 📐 Razonamiento Lógico",
    "11:00 😴 Dormir"
  ],
  "Jueves": [
    "9:00 - 12:00 🏋️ Gimnasio",
    "1:00 - 2:00 🗣️ Inglés",
    "2:00 - 4:30 🎓 UNICARIBE",
    "7:00 - 10:00 📊 Precálculo",
    "11:00 😴 Dormir"
  ],
  "Viernes": [
    "9:00 - 12:00 🏋️ Gimnasio",
    "1:00 - 2:00 🗣️ Inglés",
    "2:00 - 4:30 🎓 UNICARIBE",
    "6:00 - 9:00 🌍 Cambio Climático",
    "11:00 😴 Dormir"
  ]
};

let extra = JSON.parse(localStorage.getItem("extra")) || {};
let done = JSON.parse(localStorage.getItem("done")) || {};

function save() {
  localStorage.setItem("extra", JSON.stringify(extra));
  localStorage.setItem("done", JSON.stringify(done));
}

function toggle(id) {
  done[id] = !done[id];
  save();
  render();
}

function addTask(day) {
  const text = prompt("Nueva actividad:");
  if (!text) return;
  if (!extra[day]) extra[day] = [];
  extra[day].push(text);
  save();
  render();
}

function render() {
  const cal = document.getElementById("calendar");
  cal.innerHTML = "";

  Object.keys(base).forEach(day => {
    const box = document.createElement("div");
    box.className = "day";
    box.innerHTML = `<h2>${day}</h2>`;

    base[day].forEach((t, i) => {
      const id = day + "-base-" + i;
      const row = document.createElement("div");
      row.className = "task" + (done[id] ? " done" : "");
      row.innerHTML = `
        <input type="checkbox" ${done[id] ? "checked" : ""} onclick="toggle('${id}')">
        <span>${t}</span>
      `;
      box.appendChild(row);
    });

    (extra[day] || []).forEach((t, i) => {
      const id = day + "-extra-" + i;
      const row = document.createElement("div");
      row.className = "task" + (done[id] ? " done" : "");
      row.innerHTML = `
        <input type="checkbox" ${done[id] ? "checked" : ""} onclick="toggle('${id}')">
        <span>${t}</span>
      `;
      box.appendChild(row);
    });

    const btn = document.createElement("button");
    btn.className = "add-btn";
    btn.textContent = "➕ Agregar actividad";
    btn.onclick = () => addTask(day);
    box.appendChild(btn);

    cal.appendChild(box);
  });
}

render();
</script>

</body>
</html>
