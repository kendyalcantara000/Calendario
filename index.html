<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Mi Calendario</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
:root{
  --bg:#f4f6f8;
  --card:#ffffff;
  --text:#000;
}
.dark{
  --bg:#121212;
  --card:#1e1e1e;
  --text:#ffffff;
}
body{
  margin:0;
  padding:15px;
  font-family:Arial, sans-serif;
  background:var(--bg);
  color:var(--text);
}
h1{text-align:center;}
.top{
  display:flex;
  justify-content:space-between;
  margin-bottom:15px;
}
button{
  padding:6px 10px;
  border:none;
  border-radius:6px;
  cursor:pointer;
}
.day{
  background:var(--card);
  border-radius:12px;
  padding:15px;
  margin-bottom:15px;
}
.task{
  display:flex;
  align-items:center;
  gap:6px;
  margin:6px 0;
}
.task span{flex:1;}
.done span{text-decoration:line-through;opacity:.6;}
</style>
</head>

<body>

<div class="top">
  <button onclick="toggleDark()">🌙 / ☀️</button>
  <button onclick="showToday()">📆 HOY</button>
</div>

<h1>📅 Mi Calendario</h1>

<div id="calendar"></div>

<!-- ⚠️ SOLO ESTA LÍNEA DE JS -->
<script src="app.js"></script>

</body>
</html>
