<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Mi Calendario</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
:root {
  --bg: #f4f6f8;
  --card: #ffffff;
  --text: #000000;
}

.dark {
  --bg: #121212;
  --card: #1e1e1e;
  --text: #ffffff;
}

body {
  background: var(--bg);
  color: var(--text);
  font-family: Arial, sans-serif;
  margin: 0;
  padding: 15px;
}

h1 {
  text-align: center;
}

.top-bar {
  display: flex;
  justify-content: space-between;
  margin-bottom: 15px;
}

button {
  padding: 8px 12px;
  border: none;
  border-radius: 6px;
  cursor: pointer;
}

.day {
  background: var(--card);
  padding: 15px;
  border-radius: 12px;
  margin-bottom: 15px;
}

.task {
  display: flex;
  align-items: center;
  margin: 6px 0;
}

.task span {
  flex: 1;
  margin-left: 8px;
}

.done span {
  text-decoration: line-through;
  opacity: 0.6;
}

.delete {
  background: #e03131;
  color: #fff;
  margin-left: 8px;
}
</style>
</head>
